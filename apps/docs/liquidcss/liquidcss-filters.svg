<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <!-- LiquidCSS refraction filters — include this sprite once per page, utilities reference it via filter: url(#id) -->
  <defs>
  <filter id="lg-refract-1" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="lg-noise" />
    <feGaussianBlur in="lg-noise" stdDeviation="1.5" result="lg-noise-smooth" />
    <feDisplacementMap in="SourceGraphic" in2="lg-noise-smooth" scale="6" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <filter id="lg-refract-2" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.010 0.016" numOctaves="2" seed="7" result="lg-noise" />
    <feGaussianBlur in="lg-noise" stdDeviation="1.5" result="lg-noise-smooth" />
    <feDisplacementMap in="SourceGraphic" in2="lg-noise-smooth" scale="12" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <filter id="lg-refract-3" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="3" seed="7" result="lg-noise" />
    <feGaussianBlur in="lg-noise" stdDeviation="1.5" result="lg-noise-smooth" />
    <feDisplacementMap in="SourceGraphic" in2="lg-noise-smooth" scale="20" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <filter id="lg-refract-4" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="3" seed="7" result="lg-noise" />
    <feGaussianBlur in="lg-noise" stdDeviation="1.5" result="lg-noise-smooth" />
    <feDisplacementMap in="SourceGraphic" in2="lg-noise-smooth" scale="32" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <filter id="lg-refract-5" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.009" numOctaves="4" seed="7" result="lg-noise" />
    <feGaussianBlur in="lg-noise" stdDeviation="1.5" result="lg-noise-smooth" />
    <feDisplacementMap in="SourceGraphic" in2="lg-noise-smooth" scale="48" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <filter id="lg-lens" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.004" numOctaves="2" seed="3" result="lg-noise" />
    <feGaussianBlur in="lg-noise" stdDeviation="1.5" result="lg-noise-smooth" />
    <feDisplacementMap in="SourceGraphic" in2="lg-noise-smooth" scale="60" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <filter id="lg-wave" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.002 0.02" numOctaves="2" seed="11" result="lg-noise" />
    <feGaussianBlur in="lg-noise" stdDeviation="1.5" result="lg-noise-smooth" />
    <feDisplacementMap in="SourceGraphic" in2="lg-noise-smooth" scale="28" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  </defs>
</svg>
